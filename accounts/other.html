<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Angle</title>
	<link rel="stylesheet" type="text/css" href="../style.css">
</head>
<body>   <!-- IDEA: Make header "My socials" and change the list names to the platforms -->
	
	<section id="menuButtons">
		<a href="accounts.html"><img src="../assets/pixelArrow.png"></a>
		<section>
			<img src="../assets/pixelSun.png">
			<menu>
				<li>
					<input type="radio" id="flashlight" name="themeRadio">
					<label for="flashlight">
						Flashlight
						<hr>
						<section>
							<figure id="background"></figure>
							<figure id="unfocused"></figure>
							<figure id="primary"></figure>
						</section>
					</label>
				</li>
				<li>
					<input type="radio" id="grayzone" name="themeRadio">
					<label for="grayzone">
						Grayzone
						<hr>
						<section>
							<figure id="background"></figure>
							<figure id="unfocused"></figure>
							<figure id="primary"></figure>
						</section>
					</label>
				</li>
				<li>
					<input type="radio" id="thomas" name="themeRadio">
					<label for="thomas">
						Thomas
						<hr>
						<section>
							<figure id="background"></figure>
							<figure id="unfocused"></figure>
							<figure id="primary"></figure>
						</section>
					</label>
				</li>
			</menu>
		</section>
	</section>


	<main id="accountList">
		<img id="accountListLogo" src="../assets/acute.png" alt="Diagram of an acute angle">
		<a class="accountEntry" href="https://github.com/AngleAcute"><img src="../assets/logos/githubLogo.png" alt="Github">AngleAcute</a>
	</main>
	
	<script src="../script.js"></script>
</body>
</html>
